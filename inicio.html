<!DOCTYPE html>
<html lang="es">
<!-- Puerta de entrada del patcher. Nunca cambia: solo carga index.html con una
     marca de tiempo para que Windows no muestre una versión vieja guardada. -->
<head>
<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<script>location.replace('index.html?t=' + new Date().getTime());</script>
</head>
<body style="background:#1a1208"></body>
</html>
